<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" font-family="'JetBrainsMono Nerd Font','Noto Sans CJK SC',monospace">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d29"/>
      <stop offset="1" stop-color="#12141c"/>
    </linearGradient>
    <clipPath id="coverClip"><rect x="0" y="0" width="20" height="20" rx="6"/></clipPath>
  </defs>

  <!-- 桌面背景 -->
  <rect width="1280" height="760" fill="url(#wall)"/>
  <text x="640" y="400" fill="#2a2e40" font-size="20" text-anchor="middle">桌面</text>

  <!-- ============ 顶栏 ============ -->
  <rect x="0" y="0" width="1280" height="30" fill="#161822"/>
  <line x1="0" y1="30" x2="1280" y2="30" stroke="#262a3a" stroke-width="1"/>

  <!-- 左：workspaces -->
  <text x="14" y="20" fill="#8890a8" font-size="12">1  <tspan fill="#c8cee2">2</tspan>  3  4</text>

  <!-- 中：clock -->
  <text x="640" y="20" fill="#c8cee2" font-size="12" text-anchor="middle">10/31  09:52</text>

  <!-- 右：tray 等 -->
  <text x="1150" y="20" fill="#8890a8" font-size="11">󰂚 󰂯 󰌾 </text>

  <!-- ======= 我们的小部件：封面 + 歌词条（紧凑态） ======= -->
  <rect x="940" y="5" width="18" height="18" rx="6" fill="#3d4666"/>
  <rect x="940" y="5" width="18" height="18" rx="6" fill="none" stroke="#4a5578" stroke-width="1"/>
  <text x="943" y="19" fill="#8890a8" font-size="9">♫</text>
  <!-- 歌词条：已唱加粗亮色，未唱灰 -->
  <text x="964" y="20" font-size="12">
    <tspan font-weight="bold" fill="#e8ecf8">只有等别人兑现</tspan><tspan fill="#5c6478">的诺言</tspan>
  </text>

  <!-- 部件范围示意（注释） -->
  <rect x="936" y="3" width="180" height="24" rx="8" fill="none" stroke="#3d4666" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="1122" y="20" fill="#4a5578" font-size="9">← 悬浮于顶栏右侧</text>

  <!-- ============ 点击展开：歌词面板 ============ -->
  <g>
    <rect x="340" y="80" width="600" height="560" rx="16" fill="#181b27" stroke="#2c3145" stroke-width="1"/>
    <!-- 面板阴影暗示 -->
    <rect x="340" y="80" width="600" height="4" rx="2" fill="#262a3a"/>

    <!-- 面板标题区：曲目信息 -->
    <text x="640" y="130" fill="#e8ecf8" font-size="18" font-weight="bold" text-anchor="middle">匆匆那年</text>
    <text x="640" y="152" fill="#8890a8" font-size="12" text-anchor="middle">王菲 · 匆匆那年</text>

    <!-- 歌词列表 -->
    <g font-size="15">
      <!-- 远处行 -->
      <text x="640" y="215" fill="#3d4666" text-anchor="middle">匆匆那年 我们究竟说了几遍 再见之后再拖延</text>
      <text x="640" y="248" fill="#3d4666" text-anchor="middle">只是过去Cannot回去的昨天</text>
      <!-- 近处行 -->
      <text x="640" y="281" fill="#7a8299" text-anchor="middle">匆匆那年 我们仓促说过的再见</text>
      <!-- 上一行 -->
      <text x="640" y="314" fill="#a8b0c8" text-anchor="middle">等别人来兑现的诺言</text>
      <!-- 当前行：强调色 + 加粗 -->
      <text x="640" y="352" fill="#7aa2f7" font-weight="bold" font-size="17" text-anchor="middle">只有等别人兑现的诺言</text>
      <!-- 高亮指示 -->
      <rect x="440" y="338" width="400" height="22" rx="11" fill="#7aa2f7" opacity="0.12"/>
      <!-- 下一行 -->
      <text x="640" y="390" fill="#7a8299" text-anchor="middle">我不敢扔 也不敢再等</text>
      <!-- 远处行 -->
      <text x="640" y="423" fill="#3d4666" text-anchor="middle">匆匆那年 我们究竟说了几遍</text>
      <text x="640" y="456" fill="#3d4666" text-anchor="middle">再见之后再拖延</text>
      <text x="640" y="489" fill="#2e3346" text-anchor="middle">如果再见不能红着眼 是否还能红着脸</text>
      <text x="640" y="522" fill="#2e3346" text-anchor="middle">就像那年匆促刻下永远一起那样美丽的谣言</text>
    </g>

    <!-- 浏览模式提示：回到当前行按钮（仅手动滚动后出现） -->
    <g>
      <rect x="556" y="586" width="168" height="30" rx="15" fill="#20243a" stroke="#3d4666"/>
      <text x="640" y="606" fill="#c8cee2" font-size="12" text-anchor="middle">回到当前行</text>
    </g>

    <!-- 底部进度示意 -->
    <rect x="380" y="610" width="480" height="3" rx="1.5" fill="#262a3a"/>
    <rect x="380" y="610" width="180" height="3" rx="1.5" fill="#7aa2f7"/>
    <text x="380" y="628" fill="#5c6478" font-size="10">0:47</text>
    <text x="836" y="628" fill="#5c6478" font-size="10">4:01</text>

    <!-- 标注 -->
    <text x="640" y="700" fill="#4a5578" font-size="10" text-anchor="middle">当前行：主题强调色 + 加粗（图示蓝为 dark 主题 accent）｜点击任意行跳播｜手动滚动后出现「回到当前行」，2.5s 自动恢复跟随</text>
  </g>

  <!-- 词级卡拉OK细节放大 -->
  <g>
    <rect x="60" y="80" width="240" height="120" rx="12" fill="#181b27" stroke="#2c3145"/>
    <text x="80" y="108" fill="#8890a8" font-size="11" font-weight="bold">词级卡拉OK（顶栏放大）</text>
    <text x="80" y="140" font-size="14">
      <tspan font-weight="bold" fill="#e8ecf8">只</tspan><tspan font-weight="bold" fill="#e8ecf8">有</tspan><tspan font-weight="bold" fill="#e8ecf8">等</tspan><tspan font-weight="bold" fill="#e8ecf8">别</tspan><tspan font-weight="bold" fill="#e8ecf8">人</tspan><tspan font-weight="bold" fill="#e8ecf8">兑</tspan><tspan font-weight="bold" fill="#e8ecf8">现</tspan><tspan fill="#5c6478">的诺言</tspan>
    </text>
    <text x="80" y="170" fill="#5c6478" font-size="10">已唱字加粗亮色，未唱字置灰</text>
    <text x="80" y="186" fill="#5c6478" font-size="10">逐字推进（lyricsd 词级源）</text>
  </g>

  <g>
    <rect x="980" y="80" width="240" height="120" rx="12" fill="#181b27" stroke="#2c3145"/>
    <text x="1000" y="108" fill="#8890a8" font-size="11" font-weight="bold">无词降级</text>
    <text x="1000" y="140" font-size="13" fill="#7a8299">封面 +「暂无歌词」</text>
    <text x="1000" y="166" fill="#5c6478" font-size="10">部件不消失、不刷屏</text>
    <text x="1000" y="184" fill="#5c6478" font-size="10">hideWhenIdle=true 且暂停时隐藏</text>
  </g>
</svg>
