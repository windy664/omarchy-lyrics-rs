<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" font-family="'JetBrainsMono Nerd Font','Noto Sans CJK SC',monospace">
  <rect width="1200" height="560" fill="#12141c"/>
  <text x="32" y="44" fill="#8890a8" font-size="16" font-weight="bold">顶栏歌词 · 效果图（2 倍放大，实际高 30px）</text>

  <!-- ========== 状态 1：播放中，词级卡拉OK推进（t=52s） ========== -->
  <g>
    <text x="32" y="92" fill="#4a5578" font-size="12">① 播放中 · 词级源 · 已唱 7 字</text>
    <rect x="0" y="104" width="1200" height="60" fill="#161822"/>
    <line x1="0" y1="104" x2="1200" y2="164" stroke="#262a3a"/>
    <text x="24" y="140" fill="#8890a8" font-size="22">1  <tspan fill="#e8ecf8">2</tspan>  3  4</text>
    <text x="600" y="140" fill="#c8cee2" font-size="22" text-anchor="middle">10/31  09:52</text>
    <!-- 封面 24px 圆角 -->
    <rect x="920" y="116" width="36" height="36" rx="10" fill="#3d4666"/>
    <text x="930" y="142" fill="#8890a8" font-size="16">♫</text>
    <!-- 歌词条：已唱加粗亮 / 未唱灰 -->
    <text x="972" y="142" font-size="22">
      <tspan font-weight="bold" fill="#e8ecf8">只有等别人兑</tspan><tspan fill="#5c6478">现的诺言</tspan>
    </text>
  </g>

  <!-- ========== 状态 2：同句推进到 11 字 ========== -->
  <g>
    <text x="32" y="204" fill="#4a5578" font-size="12">② 同一句推进中 · 逐字点亮</text>
    <rect x="0" y="216" width="1200" height="60" fill="#161822"/>
    <line x1="0" y1="216" x2="1200" y2="276" stroke="#262a3a"/>
    <text x="24" y="252" fill="#8890a8" font-size="22">1  <tspan fill="#e8ecf8">2</tspan>  3  4</text>
    <text x="600" y="252" fill="#c8cee2" font-size="22" text-anchor="middle">10/31  09:53</text>
    <rect x="920" y="228" width="36" height="36" rx="10" fill="#3d4666"/>
    <text x="930" y="254" fill="#8890a8" font-size="16">♫</text>
    <text x="972" y="254" font-size="22">
      <tspan font-weight="bold" fill="#e8ecf8">只有等别人兑现的诺</tspan><tspan fill="#5c6478">言</tspan>
    </text>
  </g>

  <!-- ========== 状态 3：换到下一句，行切换动画 ========== -->
  <g>
    <text x="32" y="316" fill="#4a5578" font-size="12">③ 换行 · 宽度动画过渡到新句</text>
    <rect x="0" y="328" width="1200" height="60" fill="#161822"/>
    <line x1="0" y1="328" x2="1200" y2="388" stroke="#262a3a"/>
    <text x="24" y="364" fill="#8890a8" font-size="22">1  <tspan fill="#e8ecf8">2</tspan>  3  4</text>
    <text x="600" y="364" fill="#c8cee2" font-size="22" text-anchor="middle">10/31  09:53</text>
    <rect x="920" y="340" width="36" height="36" rx="10" fill="#3d4666"/>
    <text x="930" y="366" fill="#8890a8" font-size="16">♫</text>
    <text x="972" y="366" font-size="22">
      <tspan font-weight="bold" fill="#e8ecf8">我不敢扔</tspan><tspan fill="#5c6478"> 也不敢再等</tspan>
    </text>
  </g>

  <!-- ========== 状态 4：LRCLIB 行级降级（无词级时间轴） ========== -->
  <g>
    <text x="32" y="428" fill="#4a5578" font-size="12">④ 行级降级（LRCLIB，无逐字时间轴）· 整行亮</text>
    <rect x="0" y="440" width="1200" height="60" fill="#161822"/>
    <line x1="0" y1="440" x2="1200" y2="500" stroke="#262a3a"/>
    <text x="24" y="476" fill="#8890a8" font-size="22">1  2  <tspan fill="#e8ecf8">3</tspan>  4</text>
    <text x="600" y="476" fill="#c8cee2" font-size="22" text-anchor="middle">10/31  09:55</text>
    <rect x="920" y="452" width="36" height="36" rx="10" fill="#3d4666"/>
    <text x="930" y="478" fill="#8890a8" font-size="16">♫</text>
    <text x="972" y="478" font-size="22" fill="#e8ecf8">共你有過最美的邂逅 共你有過一些風雨憂愁</text>
  </g>

  <!-- ========== 状态 5：无词/暂停降级 ========== -->
  <g>
    <text x="32" y="540" fill="#4a5578" font-size="12">⑤ 暂无歌词（部件不消失）／ hideWhenIdle 且暂停 → 整块隐藏，顶栏恢复原样</text>
    <rect x="920" y="524" width="36" height="28" rx="8" fill="#3d4666" opacity="0.6"/>
    <text x="968" y="546" font-size="20" fill="#5c6478">暂无歌词</text>
  </g>
</svg>
