[package]
name = "lyricsd"
version = "0.1.0"
edition = "2024"

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"

[profile.release]
lto = true
strip = true
